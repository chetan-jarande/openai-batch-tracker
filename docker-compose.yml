services:
  # --- Development Service ---
  app-dev:
    profiles: [dev]
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: batch_tracker_app_dev
    env_file: [.env]
    environment:
      - CONF_ENV=dev
      - SERVER_PORT=8000
      - PYTHONPATH=/app
    volumes:
      - ./app:/app/app
      - ./docs:/app/docs
      - ./tests:/app/tests
      - app_logs:/app/logs
    ports: ["8000:8000"]
    networks: [batch_tracker_network]
    depends_on:
      redis:
        condition: service_healthy

  inspector:
    profiles: [dev]
    image: ghcr.io/modelcontextprotocol/inspector:latest
    container_name: batch_tracker_inspector
    command: ["--config", "/app/inspector.mcp.json", "--server", "default-server"]
    environment:
      - HOST=0.0.0.0
      # - DANGEROUSLY_OMIT_AUTH=true
    ports:
      - "6274:6274" # Inspector UI
      - "6277:6277" # Inspector Proxy
    volumes:
      - ./inspector.mcp.json:/app/inspector.mcp.json
    networks:
      - batch_tracker_network
    depends_on:
      app-dev:
        condition: service_started

  # --- Production Service ---
  app-prod:
    profiles: [prod]
    build:
      context: .
      dockerfile: Dockerfile
    container_name: batch_tracker_app_prod
    env_file: [.env]
    environment:
      - CONF_ENV=prod
      - SERVER_PORT=8001
    volumes:
      - app_logs:/app/logs
    ports: ["8001:8001"]
    networks: [batch_tracker_network]
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  # --- Redis Service (available in dev & prod) ---
  redis:
    image: redis:7-alpine
    container_name: batch_tracker_redis
    profiles: [dev, prod]
    command: ["redis-server", "--appendonly", "yes"]
    networks: [batch_tracker_network]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped

volumes:
  app_logs:
  redis_data:

networks:
  batch_tracker_network:
    driver: bridge
