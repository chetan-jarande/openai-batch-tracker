version: '3.8'

services:
  # FastAPI Application Service
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: batch_tracker_app
    env_file:
      - .env
    volumes:
      # Mount a volume for persistent logs
      - app_logs:/app/logs
      # For development, you can uncomment the next line to live-reload code changes
      - ./app:/app/app
    ports:
      - "8000:8000"
    networks:
      - batch_tracker_network

# Define named volumes for persistent data
volumes:
  app_logs:
    driver: local

# Define a custom network for the service
networks:
  batch_tracker_network:
    driver: bridge
