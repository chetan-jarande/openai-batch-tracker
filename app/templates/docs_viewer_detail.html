<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>{{ title }}</title>
    <link rel="stylesheet" href="{{ url_for('static', path='/styles.css') }}">
    <style>
        .doc-content {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            padding: 2rem;
            margin-top: 2rem;
        }
        .doc-content h1, .doc-content h2, .doc-content h3 {
            color: #6dd5ed;
        }
        .doc-content table {
            width: 100%;
            border-collapse: collapse;
        }
        .doc-content th, .doc-content td {
            border: 1px solid #444;
            padding: 8px;
        }
        .doc-content th {
            background-color: #333;
        }
        .doc-content pre {
            background-color: #000;
            padding: 1rem;
            border-radius: 8px;
            overflow-x: auto;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>{{ title }}</h1>
        <div class="doc-content">
            {{ content|safe }}
        </div>
    </div>
</body>
</html>
